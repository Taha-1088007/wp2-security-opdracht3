{% extends "layouts/expert_base.html.jinja" %}
{% block main %}
<h2 class="visually-hidden">Profiel pagina</h2>

<section class="profile-section" id="nieuwe-registraties" aria-labelledby="registraties-heading">
    <h2 id="registraties-heading">Profiel</h2>

    <form method="post" action="/expert/expert_profile/update">
        <caption class="visually-hidden">Profiel pagina</caption>
        <label for="user-id">Gebruikers ID:</label>
        <input type="hidden" name="user_id" id="user-id" value="{{ profile.id}}">
        <label for="first_name">Naam:</label>
        <input type="text" name="first_name" id="first_name" value="{{ profile.first_name}}">
        <label for="last_name">Achternaam:</label>
        <input type="text" name="last_name" id="last_name" value="{{ profile.last_name}}">
        <label for="postcode">Postcode:</label>
        <input type="text" name="postcode" id="postcode" pattern="[1-9][0-9]{3}\s?[A-Za-z]{2}"
            title="Vul postcode in bv. (1234AB)" value="{{ profile.postcode}}">
        <label for="gender">Geslacht:</label>
        <select id="gender" name="gender">
            <option value="V" {% if profile.gender=='V' %}selected{% endif %}> Vrouw</option>
            <option value="M" {% if profile.gender=='M' %}selected{% endif %}> Man</option>
        </select>

        <label for="phone">Telefoon:</label>
        <input type="tel" name="phone" id="phone" pattern="[0-9]{10}"
            title="Telefoon nummer mag max 10 nummers bevatten" value="{{ profile.phone}}">
        <label for="birth_date">Geboortedatum:</label>
        <input type="date" name="birth_date" id="birth_date" value="{{ profile.birth_date}}">
        <label for="assistive_tools">Hulpmiddelen:</label>
        <input type="text" name="assistive_tools" id="assistive_tools" value="{{ profile.assistive_tools}}">
        <label for="intro">Intro:</label>
        <input type="text" name="intro" id="intro" value="{{ profile.intro }}">
        <label for="notes">Notities:</label>
        <input type="text" name="notes" id="notes" value="{{ profile.notes}}">

        <label for="contact_preference">Voorkeur contact</label>
        <select id="contact_preference" name="contact_preference">
            <option value="telefoon" {% if profile.contact_preference=='telefoon' %}selected{% endif %}>
                Telefoon</option>
            <option value="e-mail" {% if profile.contact_preference=='e-mail' %}selected{% endif %}>
                E-mail</option>
        </select>

        <label for="select_disability">Beperking:</label>
<select id="select_disability" name="select_disability">
    <option value="">-- Kies een beperking --</option>
    {% for disability in all_disabilities %}
        <option value="{{ disability["id"] }}"
            {% if profile_disability_item
               and disability["id"]|int == profile_disability_item["id"]|int %}
               selected
            {% endif %}>
            {{ disability["name"] }}
        </option>
    {% endfor %}
</select>

{#    Bugg fixed #}

        <button type="submit" id="main-button" class="btn btn-primary">Opslaan</button>
    </form>
</section>
{% endblock %}
